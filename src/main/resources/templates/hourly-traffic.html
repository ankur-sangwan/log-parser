<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <title>Hour and Traffic</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        .container{
            text-align:center;
            color:green;
        }
    </style>
</head>
<body>
<div class="container">
<h1>Hourly Traffic and Visitors</h1>
<table class="table table-dark table-bordered">
    <thead>
    <tr>
        <th scope="col" th:text="|Hour|" />
        <th scope="col" th:text="Visitors" />
    </tr>
    </thead>
    <tbody>
    <tr th:each="data : ${hourlyTrafficPage.content}">
        <td th:text="${data.hour}" />
        <td th:text="${data.visitors}" />
    </tr>
    </tbody>
</table>
    <ul class="pagination">
        <li th:if="${hourlyTrafficPage.totalPages > 0}" class="page-item" th:classappend="${pageNumber==hourlyTrafficPage.number + 1} ? active"
             th:each="pageNumber : ${pageNumbers}">
            <a th:href="@{/log-parser/dashboard/hourly-traffic(date=${date},page=${pageNumber})}"
               th:text=${pageNumber}
               th:class="page-link"></a>
        </li>
    </ul>
</div>
</body>
</html>
